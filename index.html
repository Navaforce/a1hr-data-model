<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A1 HR Demo: Data Model Review</title>
<style>
:root{--af:#00308f;--navy:#0b1f4d;--ink:#1b2438;--mut:#5b6478;--line:#d9dfec;--bg:#f3f5fa;--green:#1f8f5a;--grey:#6b7280;--amber:#b7791f;--red:#c0392b;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--af)}
header.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
header.top .sub{font-size:12px;color:#b9c6e6}
.prog{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.bar{flex:1;height:8px;background:#27407f;border-radius:4px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:var(--green);width:0}
.btn{background:#fff;color:var(--navy);border:1px solid #fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:#fff;border-color:#8ea2d6}
.btn:hover{filter:brightness(.93)}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:24px;max-width:1500px;margin:0 auto;padding:20px 24px 80px}
nav.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
nav.side a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px}
nav.side a:hover{background:#e4e9f6}
nav.side .dot{width:10px;height:10px;border-radius:50%;background:#c3cadb;flex:none}
nav.side .dot.approve{background:var(--green)}nav.side .dot.change{background:var(--amber)}
nav.side h4{margin:14px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
section.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:22px;overflow:hidden}
section.card>.hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
section.card>.hd h2{margin:0;font-size:19px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--af);white-space:nowrap}
.tag.std{background:var(--grey)}.tag.cus{background:var(--af)}
.vt{background:#e4e9f6;color:var(--af);padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;margin-right:3px;white-space:nowrap}
.body{padding:18px 20px}
h3{margin:22px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--af)}
h3:first-child{margin-top:0}
p{margin:6px 0}
ul{margin:6px 0 6px 18px;padding:0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}
th{background:#eef1f8;white-space:nowrap}
th button{all:unset;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
th button .ar{color:var(--mut);font-size:10px}
th[aria-sort=ascending] .ar,th[aria-sort=descending] .ar{color:var(--af)}
td code{font-size:12px;background:#eef1f8;padding:1px 5px;border-radius:4px;white-space:nowrap}
td.ex{color:#14532d;font-weight:600}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:8px 0;font-size:12px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:default}
.pager button:not([disabled]){border-color:var(--af);color:var(--af);font-weight:700;animation:pglow 2.6s ease-in-out infinite}
@keyframes pglow{0%,100%{box-shadow:0 0 3px 0 rgba(30,90,200,.25)}50%{box-shadow:0 0 10px 2px rgba(30,90,200,.45)}}
@media(prefers-reduced-motion:reduce){.pager button:not([disabled]){animation:none;box-shadow:0 0 8px 1px rgba(30,90,200,.4)}}
.dec{padding:12px 0;border-bottom:1px solid var(--line)}.dec:last-child{border-bottom:0}.dec h3{margin:0 0 4px}.dec p{margin:4px 0}.dec .review{padding:8px 0 0;border:0;background:none}
.note{background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}
.note.add{background:#eaf2ff;border-color:#b6ccf2}
.review{background:#f7f9fd;border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:10px}
.review .row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.review label{display:inline-flex;gap:7px;align-items:center;font-weight:700;cursor:pointer}
.review input[type=checkbox]{width:18px;height:18px;accent-color:var(--af)}
.review .lab-a{color:var(--green)}.review .lab-c{color:var(--amber)}
.review textarea{width:100%;min-height:62px;border:1px solid #b9c3dc;border-radius:8px;padding:8px 10px;font:inherit;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcff}
.mini b{display:block;margin-bottom:3px}
.excl{text-decoration:line-through;color:var(--mut)}
.erd{width:100%;border:1px solid var(--line);border-radius:10px;background:#fbfcff}
.erd text{font:12px sans-serif;fill:#1b2438}
/* record page mock */
.mock{border:1px solid #9fb0dc;border-radius:12px;overflow:hidden;background:#fff;margin-top:6px}
.mock .mbar{background:#eef1f8;padding:6px 12px;font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.hl{background:var(--navy);color:#fff;padding:14px 18px;border:1px solid #c9d6f2;border-radius:10px;margin:12px}
.hl .top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hl .icon{width:46px;height:46px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.hl .kind{font-size:11px;color:#b9c6e6;letter-spacing:.07em;text-transform:uppercase}
.hl .name{font-size:20px;font-weight:700}
.hl .acts{margin-left:auto;display:flex;gap:8px}
.hl .acts span{border:1px solid #c9d6f2;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;white-space:nowrap}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{position:relative;display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.badge[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:130%;background:#0a1330;color:#fff;border:1px solid #c9d6f2;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:500;white-space:normal;width:230px;z-index:5}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.keys div{border:1px solid #3a5399;border-radius:8px;padding:7px 10px}
.keys .l{display:block;font-size:11px;color:#b9c6e6;white-space:nowrap}
.keys .v{display:block;font-weight:700;font-size:13px;white-space:nowrap;overflow:visible}
.path{display:flex;margin:0 12px 6px;gap:3px}
.path span{flex:1 1 0;text-align:center;padding:8px 14px 8px 18px;background:#e4e9f6;color:#3b4561;font-size:12px;font-weight:600;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.path span.done{background:var(--green);color:#fff}.path span.cur{background:var(--af);color:#fff}
.pills{display:flex;gap:8px;margin:8px 12px}
.pills button{height:33px;border-radius:999px;border:1px solid #9fb0dc;background:#fff;color:var(--af);font-weight:700;font-size:13px;padding:0 18px;cursor:pointer}
.pills button.on{background:var(--af);color:#fff;border-color:var(--af)}
.pane{display:none;padding:4px 12px 14px}.pane.on{display:block}
.mock h4{margin:10px 0 6px;font-size:13px;color:var(--af);border-bottom:2px solid #dfe5f5;padding-bottom:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.fg div{border-bottom:1px solid #eef1f8;padding:5px 0}
.fg .l{display:block;font-size:11px;color:var(--mut)}.fg .v{display:block;font-weight:600}
.rl{margin-top:10px}
.rl .t{font-weight:700;margin-bottom:4px}
.rl table th,.rl table td{font-size:12px}
.caret{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--af);font-size:18px;flex:none}
.caret:hover{background:#e4e9f6}.caret:focus-visible{outline:2px solid var(--af)}
section.card,.tw{scroll-margin-top:84px}
section.card.collapsed>*:not(.hd){display:none}
section.card.collapsed>.hd{border-bottom:0}
section.card.collapsed .caret{transform:rotate(-90deg)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}nav.side{display:none}}
@media print{header.top .btn,nav.side{display:none}}
</style>
</head>

/* ---------- HELPERS ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="a1hr-dm-review-v1";
let STATE=JSON.parse(localStorage.getItem(KEY)||"{}");
const save=()=>{localStorage.setItem(KEY,JSON.stringify(STATE));progress();};

function tone(label){
  const t=String(label||"").replace(/^[^A-Za-z0-9]+/,"").trim().toLowerCase();
  if(!t||["no status","not rated","sla not recorded","uncategorized","blank"].includes(t))return "#6b7280";
  if(/^(complete|completed|closed|resolved|met|approved|current|excellent|satisfactory|verified|open)/.test(t)&&!/^open$/.test(t))return "#1f8f5a";
  if(/(denied|overdue|unsatisfactory|returned|full|cancelled|no show)/.test(t))return "#c0392b";
  if(/(pending|review|due|amendment|scheduled)/.test(t))return "#b7791f";
  return "#2563eb";
}
function sortKey(s){
  s=String(s).trim();
  if(/\d{4}/.test(s)&&!isNaN(Date.parse(s)))return Date.parse(s);
  const n=parseFloat(s.replace(/,/g,""));
  if(!isNaN(n)&&/^[\d.,\-]+$/.test(s))return n;
  return s.toLowerCase();
}
function vtags(s){return String(s).split(",").map(v=>`<span class="vt">${esc(v)}</span>`).join("");}
function sortTable(cols,rows,opts={}){
  const ps=opts.pageSize||0;
  return `<div class="tw" data-ps="${ps}"><table data-ps="${ps}"><thead><tr>${cols.map((c,i)=>`<th aria-sort="none" scope="col"><button type="button" data-col="${i}">${esc(c)} <span class="ar">▲▼</span></button></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>{const raw=typeof c==="object"?c.s:c;const html=typeof c==="object"?c.h:esc(c);return `<td data-s="${esc(sortKey(raw))}" data-t="${typeof sortKey(raw)}">${html}</td>`}).join("")}</tr>`).join("")}</tbody></table><div class="pager" hidden></div></div>`;
}
function applyPager(tw){
  const ps=+tw.dataset.ps;if(!ps)return;
  const rows=[...tw.querySelectorAll("tbody tr")];
  const pager=tw.querySelector(".pager");
  if(rows.length<=ps){pager.hidden=true;rows.forEach(r=>r.hidden=false);return;}
  let p=+(tw.dataset.page||1);const pages=Math.ceil(rows.length/ps);p=Math.min(Math.max(1,p),pages);tw.dataset.page=p;
  rows.forEach((r,i)=>r.hidden=!(i>=(p-1)*ps&&i<p*ps));
  pager.hidden=false;
  pager.innerHTML=`<span>${rows.length} fields</span><button data-pg="-1" ${p===1?"disabled":""}>Prev</button><span>Page ${p} of ${pages}</span><button data-pg="1" ${p===pages?"disabled":""}>Next</button>`;
}

/* ---------- RENDER ---------- */
function reviewBox(id){
  const s=STATE[id]||{};
  return `<div class="review" data-sec="${id}"><div class="row">
    <label class="lab-a"><input type="checkbox" data-act="approve" ${s.d==="approve"?"checked":""}> Approve</label>
    <label class="lab-c"><input type="checkbox" data-act="change" ${s.d==="change"?"checked":""}> Change</label>
    <span style="color:var(--mut);font-size:12px">Checking one clears the other.</span></div>
    <textarea placeholder="Notes for this section" data-note>${esc(s.c||"")}</textarea></div>`;
}
function head(id,label,extra){return `<div class="hd"><button type="button" class="caret" aria-expanded="true" aria-label="Collapse ${esc(label)}">&#9662;</button><h2>${esc(label)}</h2>${extra||""}</div>`;}

function mockHtml(o){
  const L=o.layout;const f={};o.fields.forEach(r=>f[r[1]]=r);
  const val=a=>f[a]?f[a][4]:"";const lab=a=>f[a]?f[a][0]:a;
  const glyphTone=L.badges&&L.badges[0]?tone(L.badges[0][0]):"#2563eb";
  const badges=(L.badges||[]).map(b=>`<span class="badge" style="background:${tone(b[0])}" data-tip="${esc(b[1])}">${esc(b[0])}</span>`).join("");
  const keys=(L.keys||[]).map(k=>`<div><span class="l">${esc(k[0])}</span><span class="v">${esc(k[1]||"Not set")}</span></div>`).join("");
  const path=L.path?`<div class="path">${L.path.values.map((v,i)=>`<span class="${L.path.done&&i<=L.path.current?"done":i<L.path.current?"done":i===L.path.current?"cur":""}">${esc(v)}</span>`).join("")}</div>`:"";
  const secs=L.sections.map(s=>`<h4>${esc(s[0])}</h4><div class="fg">${s[1].map(a=>{const v=val(a);return `<div><span class="l">${esc(lab(a))}</span><span class="v">${v?esc(v):`<span style="color:#6b7280">Not set</span>`}</span></div>`}).join("")}</div>`).join("");
  const rel=(L.related||[]).map(r=>`<div class="rl"><div class="t">${esc(r.title)} (${r.rows.length})</div>${sortTable(r.cols,r.rows.map(row=>row.map(c=>{const t=tone(c);const isStatus=/^(Approved|Pending|Pending Approval|In Review|Closed|Completed|Scheduled|Pending Verification|Present For Duty|On Leave)$/.test(c);return isStatus?{s:c,h:`<span class="badge" style="background:${t};padding:2px 9px;font-size:11px">${esc(c)}</span>`}:c;})),{pageSize:10})}</div>`).join("");
  const id="m_"+o.id;
  return `<div class="mock"><div class="mbar">Record page mock: ${esc(o.label)}</div>
   <div class="hl"><div class="top"><div class="icon" style="color:${glyphTone}">${L.glyph}&#xFE0E;</div><div><div class="kind">${esc(o.api)}</div><div class="name">${esc(L.title)}</div></div><div class="acts"><span>Edit</span><span>New Case</span></div></div><div class="badges">${badges}</div><div class="keys">${keys}</div></div>
   ${path}
   <div class="pills" data-pills="${id}"><button class="on" data-pane="${id}_d">Details</button><button data-pane="${id}_r">Related Records</button></div>
   <div class="pane on" id="${id}_d">${secs}</div><div class="pane" id="${id}_r">${rel||"<p>No related records.</p>"}</div></div>`;
}

function objectSection(o){
  const rows=o.fields.map(r=>[r[0],{s:r[1],h:`<code>${esc(r[1])}</code>`},r[2],r[3]||"",{s:r[4],h:`<span style="color:#14532d;font-weight:600">${esc(r[4])}</span>`},{s:r[5],h:vtags(r[5])}]);
  return `<section class="card" id="${o.id}">${head(o.id,o.label,`<span class="tag ${o.kind==="Standard"?"std":"cus"}">${o.kind} object</span><code>${esc(o.api)}</code><span>${vtags(o.uc)}</span>${o.added?'<span class="tag" style="background:var(--amber)">Proposed addition</span>':""}`)}
   <div class="body">
    <h3>Use case</h3><p>${esc(o.purpose)}</p><p><b>Relationships:</b> ${esc(o.rel)}</p>
    ${o.notes.map(n=>`<div class="note ${o.added?"add":""}">${esc(n)}</div>`).join("")}
    <h3>Fields (${o.fields.length})</h3>
    ${sortTable(["Label","API Name","Type","Details And Values","Example Value","Vignettes"],rows,{pageSize:20})}
    <h3>Page layout mock</h3>${mockHtml(o)}
   </div>${reviewBox(o.id)}</section>`;
}

function scopeSection(){
  const v=[["V1","Airman reviews online portal","In scope","Mock CAC login, landing page, case history, mobile view"],["V2","Orders change after marriage (PCS)","In scope","Agent interview, Orders Update case, case manager approval"],["V3","Enlisted retraining request","Deprioritized","Skipped. No AFSC or retraining objects modeled"],["V4","Leave request","In scope","Agent form, Leave Request record, approval"],["V5","Fitness assessment status and scheduling","In scope","Due date, policy Q&A, appointment booking"],["V6","Reasonable Accommodation","Do not do","Skipped. Civilian only, would need another persona"]];
  return `<section class="card" id="scope">${head("scope","Scope And Personas")}<div class="body">
   <h3>Vignettes</h3>
   <table><thead><tr><th>ID</th><th>Vignette</th><th>Status</th><th>Data model impact</th></tr></thead><tbody>${v.map(r=>`<tr class="${r[2]==="In scope"?"":"excl"}"><td>${r[0]}</td><td>${r[1]}</td><td><span class="badge" style="background:${r[2]==="In scope"?"#1f8f5a":"#6b7280"}">${r[2]}</span></td><td>${r[3]}</td></tr>`).join("")}</tbody></table>
   <h3>Personas</h3><div class="cols">
    <div class="mini"><b>Amy Airman (Golden Airman)</b>Experience Cloud user tied to her Contact. E-5, active duty, 3D1X2.</div>
    <div class="mini"><b>Marcus Hale (Case Worker)</b>Internal console user on the System Administrator profile, so Setup is one click away. Works Orders Update cases and approves leave in one click, with an optional comment.</div>
    <div class="mini"><b>Commander (left out for now)</b>No commander persona or login. Reports To on the Contact still holds the commander for display. Can be added later as a third persona.</div></div>
   <h3>Modeling decisions taken from the 23 Nov meeting</h3><ul>
    <li>Airman is the standard Contact linked to an Experience Cloud user. Permissions hang on the user, the UI reads the Contact.</li>
    <li>Leave Request and Fitness Assessment are custom objects, not cases.</li>
    <li>Fitness Assessment is master-detail to Contact, so roll-ups and a formula drive the next due date. Add a record and the page changes.</li>
    <li>PCS order changes are a Case record type.</li>
    <li>Portal and record pages are fully custom coded.</li>
    <li>Downstream integrations (ARROWS, FM travel voucher, DEERS, DPS) are described in the talk track, not built.</li></ul>
   <h3>Summary</h3><p>Standard objects: Account, Contact, Case, Contact To Contact Relationship. Custom objects: PCS Order, Leave Request, Fitness Assessment (already in the a1agent org) and Fitness Test Slot. PCS Order and Fitness Test Slot are additions beyond the canvas and can be rejected independently. Dependents are Contacts, per David.</p>
   </div>${reviewBox("scope")}</section>`;
}

function erdSection(){
  const W=210,H=64;
  const box=(x,y,t,s,c)=>`<g><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" fill="#fff" stroke="${c}" stroke-width="2"/><text x="${x+W/2}" y="${y+27}" text-anchor="middle" style="font-weight:700;font-size:13px">${t}</text><text x="${x+W/2}" y="${y+46}" text-anchor="middle" style="fill:#5b6478;font-size:11px">${s}</text></g>`;
  // d = unit vector pointing away from the box at the connection point
  const foot=(x,y,dx,dy)=>{const px=-dy,py=dx;const bx=x+dx*12,by=y+dy*12;return [[bx,by,x+px*7,y+py*7],[bx,by,x,y],[bx,by,x-px*7,y-py*7]].map(l=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#00308f" stroke-width="1.8"/>`).join("");};
  const bar=(x,y,dx,dy)=>{const px=-dy,py=dx;const bx=x+dx*8,by=y+dy*8;return `<line x1="${bx+px*7}" y1="${by+py*7}" x2="${bx-px*7}" y2="${by-py*7}" stroke="#00308f" stroke-width="1.8"/>`;};
  const lbl=(x,y,t)=>`<g><rect x="${x-t.length*3.2-4}" y="${y-10}" width="${t.length*6.4+8}" height="15" fill="#fbfcff"/><text x="${x}" y="${y+2}" text-anchor="middle" style="font-size:11px;fill:#00308f">${t}</text></g>`;
  const path=(d,dash)=>`<path d="${d}" fill="none" stroke="#00308f" stroke-width="2" ${dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
  // edge: path, child end (x,y,dx,dy), parent end (x,y,dx,dy), label pos
  const E=[
   ["M485,94 V230",0,[485,94,0,1],[485,230,0,-1],[485,162,"Lookup: Contact"]],
   ["M730,70 H660 V200 H560 V230",0,[560,230,0,-1],[730,70,-1,0],[660,150,"Lookup: Unit"]],
   ["M380,62 H135 V230",1,[380,62,-1,0],[135,230,0,-1],[250,56,"Lookup: PCS Order"]],
   ["M440,30 V10 H-30 V462 H30",1,[30,462,-1,0],[440,30,0,-1],[-30,300,"Source Case"]],
   ["M240,250 H380",0,[240,250,1,0],[380,250,-1,0],[310,243,"Master-Detail"]],
   ["M240,462 H310 V282 H380",1,[240,462,1,0],[380,282,-1,0],[345,300,"Lookup: Airman"]],
   ["M485,430 V294",0,[485,430,0,-1],[485,294,0,1],[485,375,"Master-Detail"]],
   ["M730,262 H590",0,[730,262,-1,0],[590,262,1,0],[660,255,"Master-Detail"]],
   ["M835,294 V430",1,[835,294,0,1],[835,430,0,-1],[835,365,"Lookup: Test Slot"]],
   ["M940,462 H975 V10 H835 V30",1,[940,462,1,0],[835,30,0,-1],[975,250,"Hosting Unit"]]
  ];
  let svg="";
  E.forEach(e=>{svg+=path(e[0],e[1]);});
  E.forEach(e=>{const c=e[2],p=e[3];svg+=foot(c[0],c[1],c[2],c[3])+bar(p[0],p[1],p[2],p[3]);});
  E.forEach(e=>{const l=e[4];svg+=lbl(l[0],l[1],l[2]);});
  svg+=box(380,30,"Case","Standard · 2 record types","#6b7280")+box(730,30,"Account (Unit)","Standard","#6b7280")
   +box(30,230,"PCS Order","Custom · addition","#b7791f")+box(380,230,"Contact (Airman)","Standard","#6b7280")+box(730,230,"Fitness Assessment","Custom","#00308f")
   +box(30,430,"Contact Relationship","Standard · dependents","#6b7280")+box(380,430,"Leave Request","Custom","#00308f")+box(730,430,"Fitness Test Slot","Custom · addition","#b7791f");
  return `<section class="card" id="erd">${head("erd","Relationship Diagram")}<div class="body">
  <svg class="erd" viewBox="-90 0 1190 530" role="img" aria-label="Entity relationship diagram">${svg}</svg>
  <p style="color:#5b6478;font-size:12px">Crow's foot = many side, bar = one side. Solid line: master-detail. Dashed: lookup, including the dependent link to Contact. Amber outline: proposed addition.</p>
  </div>${reviewBox("erd")}</section>`;
}

function accessSection(){
  const rows=[["Airman portal user","Experience Cloud user linked to the Airman Contact","Reads own Contact, Cases, Leave, Fitness, PCS and dependent relationships. Creates Leave and Cases. Cannot see other Airmen."],["Marcus Hale (case worker)","Internal Salesforce user on the System Administrator profile, console app","Cases, Contacts, all four child objects, and Setup. Approves Leave in one click (optional comment) and works Orders Update cases."],["Agents (Tarek)","Service agent (portal) and employee agent (console)","Run as the agent user; actions read Contact, Fitness, Leave, PCS and create Case, Leave, dependent Contact and relationship, Fitness Assessment."]];
  return `<section class="card" id="access">${head("access","Identity And Access")}<div class="body">
   <p>Permissions are assigned in the same deploy as each object. Nothing is built until this section is approved.</p>
   ${sortTable(["Who","Account type","Access"],rows)}
   <div class="note">Open question for the lead SE: which Experience Cloud license for Amy (Customer Community Plus vs Partner)? Master-detail children inherit the Contact's sharing, so the choice drives the sharing set. Default proposal: Customer Community Plus with a sharing set on Contact.</div>
   <div class="note">Mock CAC login: handled in the portal (Justin's pattern). Amy still authenticates with a standard Experience Cloud user behind it.</div>
  </div>${reviewBox("access")}</section>`;
}

function decisionsSection(){
  const d=DECISIONS.map(x=>`<div class="dec"><h3>${esc(x.t)}</h3><p>${esc(x.f)}</p><p class="ask"><b>Ask:</b> ${esc(x.a)}</p><div class="review" data-sec="${x.id}"><textarea placeholder="Comment on this decision" data-note>${esc((STATE[x.id]||{}).c||"")}</textarea></div></div>`).join("");
  return `<section class="card" id="decisions">${head("decisions","Open Decisions")}<div class="body">${d||"<p>No open decisions. The lead SE review of 23 Nov closed the previous two: PCS Order and Fitness Test Slot are accepted, and the commander persona is left out for now.</p>"}</div></section>`;
}


function build(){
  const main=document.getElementById("main");
  main.innerHTML=scopeSection()+erdSection()+OBJECTS.map(objectSection).join("")+accessSection()+decisionsSection();
  document.querySelectorAll(".tw").forEach(applyPager);
  let g="",h="";
  SECTIONS.forEach(s=>{if(s.group!==g){g=s.group;h+=`<h4>${g}</h4>`;}h+=`<a href="#${s.id}"><i class="dot" data-dot="${s.id}"></i>${esc(s.label)}</a>`;});
  document.getElementById("side").innerHTML=h;
  progress();
}
function progress(){
  const RS=SECTIONS.filter(s=>!s.nr);const done=RS.filter(s=>STATE[s.id]&&STATE[s.id].d).length;
  document.getElementById("progtxt").textContent=`${done} of ${RS.length} reviewed`;
  document.getElementById("progbar").style.width=(100*done/RS.length)+"%";
  SECTIONS.forEach(s=>{const d=document.querySelector(`[data-dot="${s.id}"]`);if(d)d.className="dot "+((STATE[s.id]||{}).d||"");});
}

/* ---------- EVENTS ---------- */
document.addEventListener("change",e=>{
  const cb=e.target.closest("[data-act]");if(!cb)return;
  const box=cb.closest(".review"),id=box.dataset.sec;
  STATE[id]=STATE[id]||{};
  if(cb.checked){STATE[id].d=cb.dataset.act;box.querySelectorAll("[data-act]").forEach(o=>{if(o!==cb)o.checked=false;});}
  else STATE[id].d="";
  save();
});
document.addEventListener("input",e=>{
  const ta=e.target.closest("[data-note]");if(!ta)return;
  const id=ta.closest(".review").dataset.sec;STATE[id]=STATE[id]||{};STATE[id].c=ta.value;save();
});
function setOpen(card,open){card.classList.toggle("collapsed",!open);const c=card.querySelector(".caret");c.setAttribute("aria-expanded",open);}
document.addEventListener("click",e=>{
  const car=e.target.closest(".caret");
  if(car){const card=car.closest("section.card");setOpen(card,card.classList.contains("collapsed"));return;}
  const nav=e.target.closest("nav.side a");
  if(nav){const t=document.querySelector(nav.getAttribute("href"));if(t&&t.classList.contains("collapsed"))setOpen(t,true);}
  const pill=e.target.closest(".pills button");
  if(pill){const wrap=pill.parentElement;wrap.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===pill));
    const mock=wrap.closest(".mock");mock.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id===pill.dataset.pane));return;}
  const sb=e.target.closest("th button");
  if(sb){
    const th=sb.parentElement,table=th.closest("table"),idx=+sb.dataset.col;
    const dir=th.getAttribute("aria-sort")==="ascending"?"descending":"ascending";
    table.querySelectorAll("th").forEach(x=>{x.setAttribute("aria-sort","none");const a=x.querySelector(".ar");if(a)a.textContent="▲▼";});
    th.setAttribute("aria-sort",dir);th.querySelector(".ar").textContent=dir==="ascending"?"▲":"▼";
    const tb=table.tBodies[0],rows=[...tb.rows];
    rows.sort((a,b)=>{const ca=a.cells[idx],cb=b.cells[idx];let x=ca.dataset.s,y=cb.dataset.s;
      if(ca.dataset.t==="number"&&cb.dataset.t==="number"){x=+x;y=+y;}
      return (x<y?-1:x>y?1:0)*(dir==="ascending"?1:-1);});
    rows.forEach(r=>tb.appendChild(r));
    const tw=table.closest(".tw");tw.dataset.page=1;applyPager(tw);return;}
  const pg=e.target.closest("[data-pg]");
  if(pg){const tw=pg.closest(".tw");tw.dataset.page=(+tw.dataset.page||1)+ +pg.dataset.pg;applyPager(tw);tw.scrollIntoView({block:"start"});}
});

function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function payload(){return {doc:"a1hr-data-model-review",version:DOC_VERSION,exportedAt:new Date().toISOString(),sections:SECTIONS.filter(s=>!s.nr).map(s=>({id:s.id,label:s.label,decision:(STATE[s.id]||{}).d||"none",comment:(STATE[s.id]||{}).c||""})),decisions:DECISIONS.map(x=>({id:x.id,topic:x.t,comment:(STATE[x.id]||{}).c||""}))};}
document.getElementById("expJson").onclick=()=>download("a1hr-data-model-review.json",JSON.stringify(payload(),null,2),"application/json");
document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
document.getElementById("impFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(p.doc!=="a1hr-data-model-review")throw 0;
    STATE={};p.sections.forEach(s=>{STATE[s.id]={d:s.decision==="none"?"":s.decision,c:s.comment||""};});(p.decisions||[]).forEach(x=>{STATE[x.id]={c:x.comment||""};});save();build();}
    catch(_){alert("That file is not a review export from this page.");}};
  r.readAsText(f);e.target.value="";};
document.getElementById("clearBtn").onclick=()=>{if(confirm("Clear all approvals and comments in this browser?")){STATE={};save();build();}};

build();
</script>
</body>
</html>
